  - id: uae-gov-portal
    name: UAE Government Portal (u.ae)
    aliases: ["u.ae", "UAE Government Portal", "TDRA portal", "البوابة الرسمية لحكومة الإمارات"]
    category: government
    domains: ["u.ae"]
    verification:
      status: verified
      source_name: The official portal of the UAE Government
      source_url: https://u.ae/
      checked: 2026-11-20

  - id: dewa

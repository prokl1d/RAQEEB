# Curated UAE organization registry. See docs/PLAN.md section 9.
#
# verification.status:
#   verified   - official domain confirmed by an authoritative source (gov portal, regulator, gov directory)
#   unverified - candidate domain; NOT yet confirmed. Can still be used to spot lookalikes,
#                but can never produce a "Verified Match".
# Every "verified" entry must have source_url and checked date.

organizations:
  # ---------- Government ----------
  - id: uae-gov-portal
    name: UAE Government Portal (u.ae)
    aliases: ["u.ae", "UAE Government Portal", "TDRA portal", "البوابة الرسمية لحكومة الإمارات"]
    category: government
    domains: ["u.ae"]
    verification:
      status: verified
      source_name: The official portal of the UAE Government
      source_url: https://u.ae/
      checked: 2026-11-20

  - id: dewa
    name: Dubai Electricity and Water Authority (DEWA)
    aliases: ["DEWA", "Dubai Electricity and Water Authority", "Dubai Electricity & Water Authority", "هيئة كهرباء ومياه دبي", "ديوا"]
    category: government
    domains: ["dewa.gov.ae"]
    verification:
      status: verified
      source_name: Dubai.ae government departments directory
      source_url: https://dubai.ae/en/Lists/GovernmentDepartments/DispForm.aspx?ID=1&category=
      checked: 2026-11-20
    phones: ["04 601 9999", "991"]
    phone_source: https://www.dewa.gov.ae/en/about-us/support-and-points-of-interest/support
    phone_checked: 2026-11-23

  - id: icp
    name: Federal Authority for Identity, Citizenship, Customs and Port Security (ICP)
    aliases: ["ICP", "Federal Authority for Identity", "Emirates ID", "الهيئة الاتحادية للهوية والجنسية", "الهوية والجنسية"]
    category: government
    domains: ["icp.gov.ae"]
    verification: { status: unverified }

  - id: moi
    name: Ministry of Interior
    aliases: ["Ministry of Interior", "MOI UAE", "وزارة الداخلية"]
    category: government
    domains: ["moi.gov.ae"]
    verification: { status: unverified }

  - id: dubai-police
    name: Dubai Police
    aliases: ["Dubai Police", "شرطة دبي"]
    category: government
    domains: ["dubaipolice.gov.ae"]
    verification: { status: unverified }

  - id: ad-police
    name: Abu Dhabi Police
    aliases: ["Abu Dhabi Police", "AD Police", "ADPolice", "شرطة أبوظبي", "شرطة ابوظبي", "شرطة أبو ظبي"]
    category: government
    domains: ["adpolice.gov.ae", "abudhabipolice.gov.ae"]
    verification: { status: unverified }
    phones: ["800 2626"]
    phone_source: https://www.adpolice.gov.ae/en/Media-Center/News/2021/06/28/ADP-Calls-on-the-Public-to-Communicate-with-Aman-Service
    phone_checked: 2026-11-23

  - id: rta
    name: Roads and Transport Authority (RTA)
    aliases: ["RTA", "Roads and Transport Authority", "هيئة الطرق والمواصلات"]
    category: government
    domains: ["rta.ae"]
    verification: { status: unverified }

  - id: salik
    name: Salik
    aliases: ["Salik", "سالك"]
    category: government
    domains: ["salik.ae"]
    verification: { status: unverified }

  - id: fta
    name: Federal Tax Authority
    aliases: ["Federal Tax Authority", "FTA UAE", "الهيئة الاتحادية للضرائب"]
    category: government
    domains: ["tax.gov.ae"]
    verification: { status: unverified }

  - id: mohre
    name: Ministry of Human Resources and Emiratisation (MOHRE)
    aliases: ["MOHRE", "Ministry of Human Resources and Emiratisation", "وزارة الموارد البشرية والتوطين"]

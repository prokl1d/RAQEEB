[project]
name = "raqeeb-backend"
version = "0.1.0"
description = "RAQEEB investigation engine and API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "tldextract>=5.1",
  "rapidfuzz>=3.9",
  "pyyaml>=6.0",
  "idna>=3.7",
  "dnspython>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

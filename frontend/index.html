<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="RAQEEB: evidence-based investigation of suspicious links, messages and screenshots." />
    <title>RAQEEB · Verify the claim, not just the link</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RAQEEB" />
    <meta property="og:title" content="RAQEEB · Verify the claim, not just the link" />
    <meta property="og:description" content="Evidence-based scam investigation for the UAE, in English and Arabic." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0a0a0c" />
    <script>
      // Apply the saved theme (or the system one) before first paint, so there's no flash.
      (function () {
        var t = null;
        try { t = localStorage.getItem("raqeeb-theme"); } catch (e) {}
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (t === "dark") document.documentElement.classList.add("dark");
        var l = null;
        try { l = localStorage.getItem("raqeeb-lang"); } catch (e) {}
        if (l === "ar") { document.documentElement.lang = "ar"; document.documentElement.dir = "rtl"; document.title = "رقيب · تحقّق من الادعاء، لا من الرابط فقط"; }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Roboto:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Kufi+Arabic:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Installable app (PWA) with "Share → RAQEEB". Not on the Vite dev server (port 5173),
      // so development is never served from a cache.
      if ("serviceWorker" in navigator && location.port !== "5173") {
        window.addEventListener("load", function () { navigator.serviceWorker.register("/sw.js").catch(function () {}); });
      }
    </script>
  </body>
</html>

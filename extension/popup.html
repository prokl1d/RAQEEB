<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>RAQEEB Link Guard</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { width: 320px; }
    .p { padding: 16px; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    input[type=text] { width: 100%; margin-top: 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; font: 13px "JetBrains Mono", monospace; }
    .status { font-size: 13px; margin: 12px 0 0; }
    .ok { color: var(--low); } .bad { color: var(--high); }
    small { color: var(--ink3); display: block; margin-top: 10px; line-height: 18px; }
  </style>
</head>
<body>
  <div class="p">
    <header class="brand" style="margin-bottom:8px">
      <svg width="32" height="32" viewBox="0 0 44 44" aria-hidden="true">
        <circle cx="22" cy="22" r="20" fill="none" stroke="#92722a" stroke-width="2.5" />
        <circle cx="20" cy="20" r="8" fill="none" stroke="#282a33" stroke-width="2.5" />
        <path d="m26 26 6.5 6.5" stroke="#282a33" stroke-width="2.5" stroke-linecap="round" />
      </svg>
      <div><strong>RAQEEB</strong><span>Link Guard</span></div>
    </header>
    <label>Check links before they open <input type="checkbox" id="enabled" /></label>
    <label>Open low-risk links automatically <input type="checkbox" id="autoContinue" /></label>
    <div style="padding:10px 0; font-size:14px">RAQEEB server
      <input type="text" id="backend" spellcheck="false" />
    </div>
    <p class="status" id="status">Checking connection…</p>
    <small>Works in WhatsApp Web, Gmail, Outlook and Telegram Web. Only the clicked link is sent to the RAQEEB server above. Message text is never read.</small>
  </div>
  <script src="popup.js"></script>
</body>
</html>
